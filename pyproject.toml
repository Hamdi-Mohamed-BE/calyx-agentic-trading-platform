[project]
name = "calyx-agentic-trading-platform"
version = "0.1.0"
description = "Portfolio-safe Calyx website and evidence-first agentic research pipeline"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.13.0",
  "fastapi>=0.116.0",
  "jinja2>=3.1.6",
  "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentic_flow*", "website*"]

[tool.setuptools.package-data]
website = ["templates/*.html", "templates/partials/*.html", "static/*.css", "static/*.js", "static/images/*"]
"agentic_flow.prompts" = ["*.md"]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
