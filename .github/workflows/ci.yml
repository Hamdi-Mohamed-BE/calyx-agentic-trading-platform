name: Public-surface checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Reject proprietary or generated assets
        shell: bash
        run: |
          if find . -type f \( \
            -iname '*.mq4' -o -iname '*.mq5' -o -iname '*.mqh' -o \
            -iname '*.ex4' -o -iname '*.ex5' -o -iname '*.set' -o \
            -iname '*.hst' -o -iname '*.fxt' -o -iname '*.ticks' \
          \) -print -quit | grep -q .; then
            echo "A prohibited MetaTrader source, binary, preset, or data file is tracked."
            exit 1
          fi
      - name: Install public dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

