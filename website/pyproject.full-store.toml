[project]
name = "calyx-ea-store"
version = "0.1.0"
description = "Calyx FastAPI storefront for the active MT5 EA portfolio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "jinja2>=3.1.6",
    "metatrader5>=5.0.5735",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
